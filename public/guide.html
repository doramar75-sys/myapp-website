<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111a39"><title>使い方ガイド | MYAPP</title><meta name="description" content="MYAPPの基本操作を画像で簡単に紹介。カテゴリー、検索、収納庫、NEW、フォルダ、アンインストールの使い方。"><style>

</style></head><body><header><nav><strong>MYAPP</strong><a href="/myapp-website/">← トップページに戻る</a></nav></header><main><h1>使い方ガイド</h1><p class="lead">めんどくさいを、なくそう。基本操作はこの1枚で確認できます。</p><img class="guide" src="./guide-image.png" alt="MYAPPの操作ガイド。カテゴリーの切り替え、アプリ検索、NEW、収納庫、カテゴリー追加、長押し、ドラッグ移動、フォルダ作成、上部ドラッグでのアンインストールについて説明しています。" id="guideImg"><button class="zoom" id="zoomBtn" type="button">画像をタップして拡大</button><section class="note"><h2>開発中のテスト版について</h2><p>MYAPPから端末標準のホーム画面へ切り替えた後、MYAPPが通常のアプリとして起動しなくなる場合があります。その際は、端末の「設定」→「アプリ」→「MYAPP」→「強制停止」をお試しください。端末によって操作や動作が異なる場合があります。</p></section></main><footer>© 2026 MYAPP</footer><dialog id="zoomDialog" aria-label="使い方ガイドの拡大画像"><button type="button" id="closeBtn">閉じる ✕</button><img src="./guide-image.png" alt="MYAPP使い方ガイド拡大版"></dialog><script>const d=document.getElementById('zoomDialog');const open=()=>d.showModal();document.getElementById('guideImg').addEventListener('click',open);document.getElementById('zoomBtn').addEventListener('click',open);document.getElementById('closeBtn').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d)d.close()});</script></body></html>
